name: Schermate dei lavori
on:
  workflow_dispatch:
  push:
    branches: [3d]
    paths: [".github/workflows/schermate.yml", "scripts/schermate.mjs"]
permissions:
  contents: write
jobs:
  cattura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/schermate.mjs
      - name: Salva le schermate nel ramo
        run: |
          git config user.name "schermate-bot"
          git config user.email "schermate-bot@users.noreply.github.com"
          git add public/lavori content/schermate.json
          git diff --cached --quiet || (git commit -m "Schermate dei lavori aggiornate" && git push)
